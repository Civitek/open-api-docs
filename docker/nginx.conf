server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    server_tokens off;
    autoindex off;

    # older nginx mime.types tables omit json; make sure it's served correctly
    types {
        application/json json;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Stoplight Elements (used by the *.html doc viewers) is vendored locally under docs/vendor/stoplight
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
