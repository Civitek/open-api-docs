name: Open API Docs OpenShift Dev Publish
on:
  push:
    branches:
    - test
env:
  PROJECT: open-api-docs
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  IMAGE_NAME: ${{ github.repository }}
  BUILD_ENV: "test"

jobs:
  build-and-push-to-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.extract_sha.outputs.image_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract SHA from tags
        id: extract_sha
        run: |
          IMAGE_SHA=$(echo "${{ steps.meta.outputs.tags }}" | sed 's/.*:\(.*\)/\1/')
          echo "Extracted SHA: $IMAGE_SHA"
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT

  update-helm-values:
    runs-on: ubuntu-latest
    needs: build-and-push-to-registry
    steps:
      - name: Checkout app-deployment-manifests repository
        uses: actions/checkout@v4
        with:
          repository: Civitek/app-deployment-manifests
          ref: main
          token: ${{ secrets.FCCCDEV_PAT_TOKEN }}
          path: app-deployment-manifests

      - name: Update image tag in values file
        run: |
          sed -i "s|tag: .*|tag: ${{ needs.build-and-push-to-registry.outputs.image_sha }}|" app-deployment-manifests/${{ env.PROJECT }}/values-${{ env.BUILD_ENV }}.yaml

      - name: Commit and push changes
        run: |
          cd app-deployment-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.PROJECT }}/values-${{ env.BUILD_ENV }}.yaml
          git commit -m "Update ${{ env.PROJECT }} image tag to ${{ needs.build-and-push-to-registry.outputs.image_sha }}"
          git push origin main
